name: calendza

# Keep the clean Calendza database separate from other local Postgres instances.
services:
  app:
    build:
      context: .
      args:
        CALENDZA_URL: http://localhost:3002
    container_name: calendza-app
    restart: unless-stopped
    command: ['sh', '-c', 'node scripts/migrate.mjs && node .output/server/index.mjs']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://calendza:calendza@db:5432/calendza
      CALENDZA_URL: http://localhost:3002
      AUTH_SECRET: local-compose-secret-change-before-production
      # A single local container can serve requests and run durable jobs.
      CALENDZA_PROCESS_ROLE: all
      PORT: 3000
    ports:
      - '3002:3000'

  db:
    image: postgres:18-alpine
    container_name: calendza-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendza
      POSTGRES_PASSWORD: calendza
      POSTGRES_DB: calendza
    ports:
      - '5443:5432'
    volumes:
      # Postgres 18+ wants the mount one level up, at /var/lib/postgresql, and
      # keeps data in a major-version subdirectory so pg_upgrade can work.
      - calendza-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calendza -d calendza']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  calendza-data:
